name: integracao continua e staging

on:
  push:
    branches: ["develop", "staging"]
  pull_request:
    branches: ["develop"]

jobs:
  # ============================================================================
  # ESTÁGIO BUILD — Validação de sintaxe e dependências
  # ============================================================================
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  # ============================================================================
  # ESTÁGIO LINT — Garante que o código segue o padrão da empresa
  # ============================================================================
  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Instalar dependências temporárias do lint
        run: npm install --no-save eslint globals

      - name: Criar configuração temporária do ESLint
        run: |
          cat > eslint.config.js <<'EOF'
          const globals = require("globals");

          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**", ".git/**", "dist/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs",
                globals: {
                  ...globals.node,
                  ...globals.commonjs
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            }
          ];
          EOF

      - name: Rodar lint
        run: npx eslint .

  # ============================================================================
  # JOB SONAR (develop e staging) — Análise de Qualidade de Código
  # Mede duplicidade, bugs lógicos e segurança de código (Code Smells)
  # Em develop é o último estágio; em staging é pré-requisito do release/deploy.
  # ============================================================================
  job_sonar:
    needs: estagio_lint
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=petiscos-do-antonio" > sonar-project.properties
          echo "sonar.projectName=petiscos-do-antonio" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: Exibir configuração do Sonar
        run: cat sonar-project.properties

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  # ============================================================================
  # JOB RELEASE DOCKER (staging) — Build e Push da imagem para Docker Hub
  # Gera duas tags: :staging (mutável) e :SHA (imutável, para rollback)
  # ============================================================================
  job_release_docker:
    needs: estagio_lint
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem
        run: |
          docker build -t antoniovna3434/restaurante-antonio:staging \
                        -t antoniovna3434/restaurante-antonio:${{ github.sha }} .
          docker push antoniovna3434/restaurante-antonio:staging
          docker push antoniovna3434/restaurante-antonio:${{ github.sha }}

  # ============================================================================
  # JOB TRIVY + SONAR (staging) — DevSecOps: Scan de CVE + Análise de Qualidade
  # 1. Trivy varre a imagem buscando CVEs (OS Layer + App Layer)
  # 2. Filtra CRITICAL e HIGH (CVSS >= 7.0)
  # 3. Gera relatório JSON
  # 4. SonarQube importa o JSON como External Issues (integração Trivy + Sonar)
  # ============================================================================
  job_trivy_sonar:
    needs: job_release_docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan de Segurança com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: antoniovna3434/restaurante-antonio:staging
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH

      - name: Exibir resumo do Trivy
        run: |
          echo "📋 Resumo do scan Trivy:"
          python3 -c "
          import json
          data = json.load(open('trivy-report.json'))
          results = data.get('Results', [])
          total = sum(len(r.get('Vulnerabilities', [])) for r in results)
          print(f'Total de vulnerabilidades (CRITICAL+HIGH): {total}')
          for r in results:
            for v in r.get('Vulnerabilities', []):
              print(f'  [{v[\"Severity\"]}] {v[\"VulnerabilityID\"]}: {v.get(\"Title\", \"N/A\")}')
          "

      - name: Converter Trivy JSON para formato SonarQube
        run: |
          python3 -c "
          import json

          SEVERITY_MAP = {
            'CRITICAL': 'CRITICAL',
            'HIGH': 'MAJOR',
            'MEDIUM': 'MINOR',
            'LOW': 'INFO'
          }

          trivy = json.load(open('trivy-report.json'))
          issues = []

          for result in trivy.get('Results', []):
            target = result.get('Target', 'unknown')
            for vuln in result.get('Vulnerabilities', []):
              issues.append({
                'engineId': 'trivy',
                'ruleId': vuln.get('VulnerabilityID', 'UNKNOWN'),
                'severity': SEVERITY_MAP.get(vuln.get('Severity', ''), 'INFO'),
                'type': 'VULNERABILITY',
                'primaryLocation': {
                  'message': f\"{vuln.get('VulnerabilityID','')}: {vuln.get('Title','N/A')} (pkg: {vuln.get('PkgName','')}, installed: {vuln.get('InstalledVersion','')}, fixed: {vuln.get('FixedVersion','N/A')})\",
                  'filePath': 'Dockerfile'
                }
              })

          sonar_report = {'issues': issues}
          json.dump(sonar_report, open('sonar-issues.json', 'w'), indent=2)
          print(f'✅ Convertido {len(issues)} issues para formato SonarQube')
          "

      - name: Criar sonar-project.properties para staging
        run: |
          cat > sonar-project.properties <<EOF
          sonar.projectKey=petiscos-do-antonio
          sonar.projectName=petiscos-do-antonio
          sonar.branch.name=${{ github.ref_name }}
          sonar.sources=.
          sonar.sourceEncoding=UTF-8
          sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**
          sonar.externalIssuesReportPaths=sonar-issues.json
          EOF

      - name: SonarQube Scan com relatório Trivy
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

      # -----------------------------------------------------------------
      # QUALITY GATE — Descomentar quando o SonarQube tiver QG configurado
      # -----------------------------------------------------------------
      # - name: Sonar Quality Gate
      #   uses: sonarsource/sonarqube-quality-gate-action@master
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: "https://devsecops.dcotech.com.br"

  # ============================================================================
  # JOB DEPLOY STAGING — Deploy na AWS via SCP + SSH
  # 1. SCP envia o docker-compose.staging.yml para a EC2
  # 2. SSH executa docker compose pull + up remotamente
  # ============================================================================
  job_deploy_staging:
    needs: job_trivy_sonar
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Enviar docker-compose.staging.yml e init.sql via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.staging.yml,init.sql"
          target: "/home/${{ secrets.SSH_USER }}/app"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/app

            echo "⏳ Executando init.sql no container mysql-infra..."
            sudo docker exec -i mysql-infra \
              mysql -u root -ppassword < init.sql
            echo "✅ init.sql executado com sucesso!"

            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            echo "✅ Deploy staging concluído com sucesso"