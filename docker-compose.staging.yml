services:
  db:
    image: mysql:8.0
    container_name: marmitatech-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: marmitadb
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: antoniovna3434/restaurante-antonio:staging
    container_name: marmitatech-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER:-user}
      DB_PASS: ${MYSQL_PASSWORD:-password}
      DB_NAME: marmitadb
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
