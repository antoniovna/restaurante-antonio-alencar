services:
  db:
    image: mysql:8.0
    container_name: marmitatech-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurante-antonio-db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: antoniovna3434/restaurante-antonio:staging
    container_name: restaurante-antonio-container
    ports:
      - "9101:3000"
    environment:
      DB_HOST: mysql-infra
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: password
      DB_NAME: restaurante-antonio-db
    networks:
      - rede_alunos
  networks:
    rede_alunos:
      external: true
    depends_on:
      db:
        condition: service_healthy
